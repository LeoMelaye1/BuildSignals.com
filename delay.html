<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#1c3d5a">
<title>Follow-up delayed · BuildSignals</title>
<style>
  :root {
    --blueprint: #1c3d5a;
    --blueprint-wash: #eef3f7;
    --teal: #1d8073;
    --teal-wash: #e2f2ef;
    --muted: #64748b;
    --border: #e2e8ee;
  }

  * {
    box-sizing: border-box;
  }

  html {
    -webkit-text-size-adjust: 100%;
    text-size-adjust: 100%;
  }

  body {
    margin: 0;
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--blueprint-wash);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: var(--blueprint);
    padding: 24px;
    overflow-x: hidden;
  }

  .card {
    background: #ffffff;
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 36px 28px 28px;
    max-width: 360px;
    width: 100%;
    text-align: center;
    animation: rise 0.4s ease-out;
  }

  @media (prefers-reduced-motion: reduce) {
    .card {
      animation: none;
    }
  }

  @keyframes rise {
    from {
      opacity: 0;
      transform: translateY(6px);
    }
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

  .icon {
    width: 56px;
    height: 56px;
    margin: 0 auto 18px;
    border-radius: 50%;
    background: var(--teal-wash);
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .icon svg circle,
  .icon svg path {
    stroke: var(--teal);
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
    fill: none;
  }

  h1 {
    font-size: 21px;
    font-weight: 600;
    letter-spacing: -0.01em;
    margin: 0 0 10px;
  }

  p {
    font-size: 16px;
    line-height: 1.55;
    color: var(--muted);
    margin: 0 0 26px;
  }

  p strong {
    color: var(--blueprint);
    font-weight: 600;
  }

  footer {
    display: flex;
    align-items: center;
    justify-content: center;
    flex-wrap: wrap;
    gap: 8px;
    font-size: 12px;
    border-top: 1px solid var(--border);
    padding-top: 16px;
  }

  .wordmark {
    font-weight: 600;
    color: var(--blueprint);
  }

  .timestamp {
    font-family: "SF Mono", "Roboto Mono", Consolas, monospace;
    color: var(--muted);
  }
</style>
</head>
<body>
<main class="card">
  <div class="icon" aria-hidden="true">
    <svg viewBox="0 0 24 24" width="28" height="28">
      <circle cx="12" cy="12" r="9"></circle>
      <path d="M12 7v5l3.5 2"></path>
    </svg>
  </div>
  <h1>Delayed 2 days</h1>
  <p>We'll hold off on follow-up calls until <strong id="resume-date">in 2 days</strong>. After that we'll pick back up automatically.</p>
  <footer>
    <span class="wordmark">BuildSignals</span>
    <span class="timestamp" id="timestamp">confirmed just now</span>
  </footer>
</main>
<script>
  (function () {
    var now = new Date();

    var resumeEl = document.getElementById('resume-date');
    if (resumeEl) {
      var resume = new Date(now.getTime() + 2 * 24 * 60 * 60 * 1000);
      resumeEl.textContent = resume.toLocaleDateString('en-US', {
        weekday: 'short',
        month: 'short',
        day: 'numeric'
      });
    }

    var stampEl = document.getElementById('timestamp');
    if (stampEl) {
      var date = now.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
      var time = now.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
      stampEl.textContent = 'confirmed ' + date + ', ' + time;
    }
  })();
</script>
</body>
</html>
