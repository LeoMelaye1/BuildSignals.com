<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cold Call Log</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Archivo+Black&family=Oswald:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap');

* { box-sizing: border-box; }

:root {
  --chassis: #2A2723;
  --chassis-well: #201D19;
  --chassis-raised: #3C372F;
  --flap-bg: #121110;
  --flap-ink: #EDE6D3;
  --ink: #EDE6D3;
  --ink-soft: #A79E8C;
  --ink-faint: #6E6759;
  --paper: #E3DBC6;
  --paper-alt: #D9D0B4;
  --paper-line: #B9AE92;
  --paper-ink: #2A2620;
  --accent: #D6A548;
  --sig-neutral: #9A937F;
  --sig-negative: #BD5138;
  --sig-pending: #CE9E3E;
  --sig-info: #4C85A8;
  --sig-positive: #4F9260;
  --font-numeral: 'Archivo Black', sans-serif;
  --font-label: 'Oswald', sans-serif;
  --font-mono: 'IBM Plex Mono', ui-monospace, Menlo, Consolas, monospace;
}

html, body { margin: 0; padding: 0; background: #171512; }
body { font-family: var(--font-label); }

button, input { font: inherit; }

.key-focus:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

#app { padding: 14px; min-height: 100vh; }

.loading-wrap { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 70px 0; gap: 14px; }
.loading-text { font-size: 11px; color: var(--ink-faint); letter-spacing: 0.12em; font-weight: 500; }

.chassis { background: var(--chassis); max-width: 640px; margin: 0 auto; padding: 14px; box-shadow: 0 1px 0 rgba(255,255,255,0.04) inset, 0 12px 30px rgba(0,0,0,0.35); }

.nameplate { background: var(--chassis-well); padding: 12px 14px; margin-bottom: 10px; }
.nameplate-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
.nameplate-title { font-family: var(--font-label); font-weight: 700; font-size: 15px; letter-spacing: 0.14em; color: var(--ink); }
.settings-toggle { background: var(--chassis-raised); border: none; color: var(--ink-soft); font-family: var(--font-label); font-size: 10.5px; font-weight: 600; letter-spacing: 0.08em; padding: 6px 10px; cursor: pointer; }
.nameplate-stats { display: flex; gap: 20px; }
.nameplate-stat-block { display: inline-flex; flex-direction: column; gap: 4px; }
.nameplate-stat-label { font-size: 9px; letter-spacing: 0.1em; color: var(--ink-faint); font-weight: 600; }

.settings-panel { background: var(--chassis-well); padding: 14px; margin-bottom: 10px; }
.settings-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.settings-field { display: flex; flex-direction: column; gap: 5px; }
.settings-label { font-size: 9.5px; letter-spacing: 0.1em; color: var(--ink-faint); font-weight: 600; }
.settings-input { background: var(--flap-bg); border: 1px solid var(--chassis-raised); color: var(--flap-ink); font-family: var(--font-mono); font-size: 12.5px; padding: 8px 9px; width: 100%; }
.chip-row { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.chip { font-size: 10.5px; padding: 4px 9px; border: 1px solid var(--chassis-raised); background: transparent; color: var(--ink-soft); cursor: pointer; font-family: var(--font-label); letter-spacing: 0.04em; }
.sheet-status { display: flex; align-items: center; gap: 7px; margin-top: 10px; font-size: 10px; letter-spacing: 0.04em; color: var(--ink-faint); }
.sheet-status-dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; display: inline-block; }

.mode-selector { display: flex; gap: 2px; margin-bottom: 2px; }
.mode-btn { flex: 1; background: var(--chassis-raised); border: none; color: var(--ink-soft); font-family: var(--font-label); font-weight: 600; font-size: 11.5px; letter-spacing: 0.08em; padding: 11px 6px; cursor: pointer; }
.mode-btn-active { background: var(--accent); color: var(--chassis-well); }

.panel { background: var(--chassis-well); padding: 14px; }

.key-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; margin-bottom: 14px; }
.key-btn { position: relative; display: flex; flex-direction: column; align-items: flex-start; gap: 4px; background: var(--chassis-raised); border: none; border-bottom: 3px solid rgba(0,0,0,0.35); padding: 12px 12px 10px; cursor: pointer; text-align: left; min-height: 88px; width: 100%; transition: transform .05s ease; }
.key-btn:active { transform: translateY(2px); }
.key-stripe { position: absolute; top: 0; left: 0; right: 0; height: 3px; }
.key-code { font-family: var(--font-numeral); font-size: 15px; letter-spacing: 0.02em; }
.key-label { font-family: var(--font-label); font-size: 11px; font-weight: 500; color: var(--ink-soft); letter-spacing: 0.02em; line-height: 1.25; }
.key-readout { margin-top: auto; align-self: flex-end; }

.status-line { display: flex; align-items: center; gap: 8px; background: var(--chassis-well); border-top: 1px solid var(--chassis-raised); padding-top: 12px; }
.status-line-label { font-size: 9.5px; letter-spacing: 0.1em; color: var(--ink-faint); font-weight: 600; }
.status-line-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; display: inline-block; }
.status-line-text { flex: 1; font-size: 11.5px; letter-spacing: 0.03em; color: var(--ink); font-weight: 500; }
.status-line-time { font-family: var(--font-mono); font-size: 11px; color: var(--ink-faint); }
.undo-btn { background: transparent; border: 1px solid var(--chassis-raised); color: var(--ink-soft); font-family: var(--font-label); font-size: 10px; font-weight: 600; letter-spacing: 0.08em; padding: 5px 10px; cursor: pointer; }

.range-switch { display: flex; gap: 2px; margin-bottom: 12px; flex-wrap: wrap; }
.range-btn { font-size: 10.5px; font-weight: 600; letter-spacing: 0.06em; padding: 7px 12px; border: 1px solid var(--chassis-raised); background: transparent; color: var(--ink-soft); cursor: pointer; font-family: var(--font-label); }
.range-btn-active { background: var(--accent); border-color: var(--accent); color: var(--chassis-well); }

.readout-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 8px; margin-bottom: 10px; }
.readout-card { background: var(--chassis-raised); padding: 10px 12px; }
.readout-label { font-size: 9.5px; letter-spacing: 0.1em; color: var(--ink-faint); font-weight: 600; margin-bottom: 6px; }
.readout-static { font-family: var(--font-numeral); font-size: 24px; color: var(--ink); }
.readout-pct { font-size: 14px; margin-left: 2px; color: var(--ink-soft); }
.readout-sub { font-size: 9.5px; color: var(--ink-faint); margin-top: 4px; letter-spacing: 0.04em; }

.panel-box { background: var(--chassis-raised); padding: 14px; margin-bottom: 10px; }
.panel-box-title { font-size: 9.5px; letter-spacing: 0.1em; color: var(--ink-faint); font-weight: 600; margin-bottom: 12px; }

.compare-items { display: flex; gap: 24px; flex-wrap: wrap; }
.compare-item { display: flex; flex-direction: column; gap: 3px; }
.compare-label { font-size: 9.5px; letter-spacing: 0.06em; color: var(--ink-faint); }
.compare-value { font-family: var(--font-numeral); font-size: 16px; color: var(--ink); }
.compare-delta { font-size: 10.5px; font-family: var(--font-mono); font-weight: 600; }

.chart-frame { background: var(--paper); padding: 10px 6px 4px; }
.chart-legend { display: flex; gap: 14px; justify-content: flex-end; padding: 0 6px 6px; font-size: 9.5px; letter-spacing: 0.06em; color: var(--paper-ink); }
.legend-swatch { display: inline-block; width: 8px; height: 8px; margin-right: 4px; vertical-align: middle; }

.breakdown-row { margin-bottom: 10px; }
.breakdown-label-row { display: flex; align-items: center; gap: 7px; margin-bottom: 4px; }
.breakdown-swatch { width: 8px; height: 8px; flex-shrink: 0; display: inline-block; }
.breakdown-label { font-size: 10.5px; letter-spacing: 0.04em; flex: 1; color: var(--ink-soft); }
.breakdown-value { font-family: var(--font-mono); font-size: 11.5px; font-weight: 600; color: var(--ink); }
.breakdown-track { height: 4px; background: var(--chassis-well); }
.breakdown-fill { height: 100%; }

.history-toolbar { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
.toolbar-btns { display: flex; gap: 6px; flex-wrap: wrap; }
.tool-btn { background: transparent; border: 1px solid var(--chassis-raised); color: var(--ink-soft); font-family: var(--font-label); font-size: 10px; font-weight: 600; letter-spacing: 0.06em; padding: 8px 11px; cursor: pointer; }
.tool-btn-primary { background: var(--accent); border-color: var(--accent); color: var(--chassis-well); }
.tool-btn:disabled { opacity: 0.4; cursor: default; }

.ledger { background: var(--paper); }
table.log-table { width: 100%; border-collapse: collapse; font-size: 11.5px; font-family: var(--font-label); }
.log-table th { text-align: left; font-size: 9.5px; letter-spacing: 0.06em; color: var(--paper-ink); opacity: 0.65; font-weight: 700; padding: 9px 10px; border-bottom: 2px solid var(--paper-line); }
.log-table th.th-action { width: 30px; }
.log-table tr.tr-row { border-bottom: 1px solid var(--paper-line); }
.log-table td { padding: 8px 10px; color: var(--paper-ink); vertical-align: middle; }
.log-table td.td-action { padding: 8px 6px; text-align: center; }
.outcome-dot { display: inline-block; width: 7px; height: 7px; margin-right: 6px; }
.delete-btn { background: transparent; border: none; color: var(--paper-ink); opacity: 0.5; cursor: pointer; font-size: 15px; line-height: 1; padding: 2px; }
.load-more-btn { width: 100%; padding: 9px; font-size: 10.5px; font-weight: 600; letter-spacing: 0.06em; color: var(--paper-ink); background: var(--paper-alt); border: none; border-top: 1px solid var(--paper-line); cursor: pointer; font-family: var(--font-label); }

.empty-state { font-size: 11px; letter-spacing: 0.05em; color: var(--ink-faint); padding: 20px 4px; text-align: center; }
.clear-all-btn { display: block; margin-top: 12px; font-size: 10px; letter-spacing: 0.06em; color: var(--ink-faint); background: transparent; border: none; cursor: pointer; font-family: var(--font-label); }

.modal-overlay { position: fixed; inset: 0; background: rgba(10,9,8,0.6); display: flex; align-items: center; justify-content: center; z-index: 60; padding: 20px; }
.modal-card { background: var(--chassis-raised); padding: 22px; max-width: 320px; width: 100%; border-top: 3px solid var(--sig-negative); }
.modal-title { font-family: var(--font-label); font-weight: 700; font-size: 13.5px; letter-spacing: 0.1em; color: var(--ink); margin-bottom: 10px; }
.modal-body { font-size: 12px; color: var(--ink-soft); line-height: 1.5; margin-bottom: 18px; }
.modal-actions { display: flex; gap: 8px; justify-content: flex-end; }
.modal-cancel { padding: 8px 14px; border: 1px solid var(--chassis); background: transparent; color: var(--ink-soft); font-size: 11px; font-weight: 600; letter-spacing: 0.06em; cursor: pointer; font-family: var(--font-label); }
.modal-confirm { padding: 8px 14px; border: none; background: var(--sig-negative); color: var(--ink); font-size: 11px; font-weight: 600; letter-spacing: 0.06em; cursor: pointer; font-family: var(--font-label); }

.flap-row { display: inline-flex; gap: 1px; perspective: 300px; }
.flap-cell { position: relative; display: inline-block; background: var(--flap-bg); overflow: hidden; text-align: center; }
.flap-cell::after { content: ''; position: absolute; left: 0; right: 0; top: 50%; height: 1px; background: rgba(0,0,0,0.55); }
.flap-cell-inner { display: block; color: var(--flap-ink); font-family: var(--font-numeral); backface-visibility: hidden; }
.flap-cell-inner.flap-out { animation: flapOut .12s ease-in forwards; }
.flap-cell-inner.flap-in { animation: flapIn .17s ease-out forwards; }
@keyframes flapOut { to { transform: rotateX(-85deg); opacity: .25; } }
@keyframes flapIn { from { transform: rotateX(85deg); opacity: .25; } to { transform: rotateX(0deg); opacity: 1; } }
.flap-sm .flap-cell { width: 12px; height: 16px; font-size: 12px; line-height: 16px; }
.flap-lg .flap-cell { width: 20px; height: 30px; font-size: 24px; line-height: 30px; }

@media (prefers-reduced-motion: reduce) {
  .key-btn, .flap-cell-inner { animation: none !important; transition: none !important; }
}
@media (max-width: 420px) {
  .key-grid { grid-template-columns: repeat(2, 1fr) !important; }
}
</style>
</head>
<body>

<div id="app">
  <div class="chassis">
    <div class="nameplate" id="nameplate"></div>
    <div class="settings-panel" id="settings-panel" hidden></div>
    <div class="mode-selector" id="mode-selector"></div>
    <div class="panel" id="panel"></div>
  </div>
</div>
<div id="modal-root"></div>

<script>
/* =========================================================================
   CONSTANTS
   ========================================================================= */

const OUTCOMES = [
  { id: 'no_pickup', label: 'No Pickup', short: 'No Pickup', code: 'NP', color: 'var(--sig-neutral)' },
  { id: 'pickup_no', label: 'Picked Up, Not Interested', short: 'Not Interested', code: 'NI', color: 'var(--sig-negative)' },
  { id: 'pickup_follow_up', label: 'Picked Up, Follow Up Later', short: 'Follow Up', code: 'FU', color: 'var(--sig-pending)' },
  { id: 'pickup_email', label: 'Picked Up, Send Email', short: 'Email Sent', code: 'EM', color: 'var(--sig-info)' },
  { id: 'pickup_meeting', label: 'Picked Up, Meeting Booked', short: 'Meeting Booked', code: 'MB', color: 'var(--sig-positive)' },
];
const OUTCOME_MAP = Object.fromEntries(OUTCOMES.map((o) => [o.id, o]));

const ENTRIES_KEY = 'cold_call_entries_v2';
const SETTINGS_KEY = 'cold_call_settings_v2';
const RANGE_LABEL = { today: 'TODAY', week: 'WEEK', month: 'MONTH', all: 'ALL TIME' };

/* =========================================================================
   UTIL
   ========================================================================= */

function escapeHtml(str) {
  const d = document.createElement('div');
  d.textContent = String(str ?? '');
  return d.innerHTML;
}

/* =========================================================================
   DATE HELPERS  (weeks start Monday)
   ========================================================================= */

function toLocalDateKey(input) {
  const d = new Date(input);
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  return `${y}-${m}-${day}`;
}
function toLocalMonthKey(input) {
  const d = new Date(input);
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
}
function getWeekStart(input) {
  const d = new Date(input);
  d.setHours(0, 0, 0, 0);
  const day = d.getDay();
  const diff = day === 0 ? -6 : 1 - day;
  d.setDate(d.getDate() + diff);
  return d;
}
function formatDateLabel(input) {
  return new Date(input).toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric' });
}
function formatTimeLabel(input) {
  return new Date(input).toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit' });
}
function pct(n) { return `${Math.round(n * 100)}`; }

/* =========================================================================
   STATS HELPERS
   ========================================================================= */

function computeCounts(list) {
  const dials = list.length;
  const noPickup = list.filter((e) => e.outcome === 'no_pickup').length;
  const pickupNo = list.filter((e) => e.outcome === 'pickup_no').length;
  const followUp = list.filter((e) => e.outcome === 'pickup_follow_up').length;
  const emailSent = list.filter((e) => e.outcome === 'pickup_email').length;
  const meetings = list.filter((e) => e.outcome === 'pickup_meeting').length;
  const pickups = dials - noPickup;
  const interested = followUp + emailSent + meetings;
  return {
    dials, noPickup, pickupNo, followUp, emailSent, meetings, pickups, interested,
    pickupRate: dials ? pickups / dials : 0,
    interestRate: pickups ? interested / pickups : 0,
    meetingRate: dials ? meetings / dials : 0,
  };
}

function filterByRange(entries, range) {
  const now = new Date();
  if (range === 'today') {
    const key = toLocalDateKey(now);
    return entries.filter((e) => toLocalDateKey(e.timestamp) === key);
  }
  if (range === 'week') {
    const key = toLocalDateKey(getWeekStart(now));
    return entries.filter((e) => toLocalDateKey(getWeekStart(e.timestamp)) === key);
  }
  if (range === 'lastWeek') {
    const ref = new Date(now);
    ref.setDate(ref.getDate() - 7);
    const key = toLocalDateKey(getWeekStart(ref));
    return entries.filter((e) => toLocalDateKey(getWeekStart(e.timestamp)) === key);
  }
  if (range === 'month') {
    const key = toLocalMonthKey(now);
    return entries.filter((e) => toLocalMonthKey(e.timestamp) === key);
  }
  return entries;
}

function computeDailySeries(entries, numDays) {
  const now = new Date();
  const out = [];
  for (let i = numDays - 1; i >= 0; i--) {
    const d = new Date(now);
    d.setDate(d.getDate() - i);
    const key = toLocalDateKey(d);
    const c = computeCounts(entries.filter((e) => toLocalDateKey(e.timestamp) === key));
    out.push({ date: d.toLocaleDateString(undefined, { month: 'short', day: 'numeric' }), Dials: c.dials, Meetings: c.meetings });
  }
  return out;
}

/* =========================================================================
   EXCEL EXPORT  (needs XLSX from the cdnjs script tag)
   ========================================================================= */

function buildSummaryRows(entries, granularity) {
  const groups = {};
  entries.forEach((e) => {
    let key;
    if (granularity === 'day') key = toLocalDateKey(e.timestamp);
    else if (granularity === 'week') key = toLocalDateKey(getWeekStart(e.timestamp));
    else key = toLocalMonthKey(e.timestamp);
    (groups[key] = groups[key] || []).push(e);
  });
  return Object.keys(groups).sort().map((key) => {
    const c = computeCounts(groups[key]);
    return {
      Period: granularity === 'week' ? `Week of ${key}` : key,
      Dials: c.dials, Pickups: c.pickups, 'Pickup Rate': `${pct(c.pickupRate)}%`,
      'Not Interested': c.pickupNo, 'Follow Up': c.followUp, 'Emails Sent': c.emailSent,
      'Meetings Booked': c.meetings, 'Meeting Rate': `${pct(c.meetingRate)}%`,
    };
  });
}

function exportToExcel(entries) {
  if (typeof XLSX === 'undefined') {
    alert('The Excel library did not load. Check your internet connection and try again.');
    return;
  }
  const wb = XLSX.utils.book_new();
  const rawRows = [...entries].sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp)).map((e) => ({
    Date: toLocalDateKey(e.timestamp), Time: formatTimeLabel(e.timestamp),
    'Day of Week': new Date(e.timestamp).toLocaleDateString(undefined, { weekday: 'long' }),
    Outcome: OUTCOME_MAP[e.outcome]?.label || e.outcome, Campaign: e.campaign || '', Caller: e.caller || '',
    'Synced to Sheet': e.sheetSynced ? 'Yes' : 'No',
  }));
  const rawSheet = XLSX.utils.json_to_sheet(rawRows);
  rawSheet['!cols'] = [{ wch: 12 }, { wch: 10 }, { wch: 12 }, { wch: 28 }, { wch: 20 }, { wch: 16 }, { wch: 14 }];
  XLSX.utils.book_append_sheet(wb, rawSheet, 'Call Log');

  const summaryCols = [{ wch: 16 }, { wch: 8 }, { wch: 9 }, { wch: 12 }, { wch: 15 }, { wch: 10 }, { wch: 12 }, { wch: 16 }, { wch: 13 }];
  ['day', 'week', 'month'].forEach((g) => {
    const sheet = XLSX.utils.json_to_sheet(buildSummaryRows(entries, g));
    sheet['!cols'] = summaryCols;
    XLSX.utils.book_append_sheet(wb, sheet, g === 'day' ? 'Daily Summary' : g === 'week' ? 'Weekly Summary' : 'Monthly Summary');
  });
  XLSX.writeFile(wb, `cold-call-log-${toLocalDateKey(new Date())}.xlsx`);
}

/* =========================================================================
   GOOGLE SHEET SYNC
   text/plain avoids a CORS preflight, which Apps Script web apps don't
   handle. no-cors means no response can be read back, so this is
   fire-and-forget: it only throws on a real network failure.
   ========================================================================= */

async function syncEntryToSheet(sheetUrl, entry) {
  if (!sheetUrl) return false;
  try {
    await fetch(sheetUrl, {
      method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({
        date: toLocalDateKey(entry.timestamp), time: formatTimeLabel(entry.timestamp),
        dayOfWeek: new Date(entry.timestamp).toLocaleDateString(undefined, { weekday: 'long' }),
        outcome: OUTCOME_MAP[entry.outcome]?.label || entry.outcome,
        campaign: entry.campaign || '', caller: entry.caller || '', timestamp: entry.timestamp,
      }),
    });
    return true;
  } catch (err) {
    console.error('Sheet sync failed', err);
    return false;
  }
}

/* =========================================================================
   FLAP COUNTER  (split-flap / odometer style readout)
   ========================================================================= */

function createFlapCounter(container, initialValue, pad, size) {
  if (!container) return { setValue() {}, destroy() {} };
  let current = String(Math.max(0, Math.floor(initialValue || 0))).padStart(pad, '0');
  container.classList.add('flap-row', `flap-${size}`);
  container.innerHTML = current.split('').map((ch) => `<span class="flap-cell"><span class="flap-cell-inner">${ch}</span></span>`).join('');
  let timers = [];

  function setValue(raw) {
    const next = String(Math.max(0, Math.floor(raw || 0))).padStart(pad, '0');
    if (next === current) return;
    timers.forEach(clearTimeout);
    timers = [];
    const cells = container.querySelectorAll('.flap-cell-inner');
    cells.forEach((c) => c.classList.add('flap-out'));
    const t1 = setTimeout(() => {
      current = next;
      container.innerHTML = current.split('').map((ch) => `<span class="flap-cell"><span class="flap-cell-inner flap-in">${ch}</span></span>`).join('');
      const t2 = setTimeout(() => {
        container.querySelectorAll('.flap-cell-inner').forEach((c) => c.classList.remove('flap-in'));
      }, 170);
      timers.push(t2);
    }, 120);
    timers.push(t1);
  }
  function destroy() { timers.forEach(clearTimeout); }
  return { setValue, destroy };
}

/* =========================================================================
   HAND-DRAWN SVG BAR CHART  (no charting library dependency)
   ========================================================================= */

function renderBarChartSvg(data, width, height) {
  const pad = { top: 8, right: 6, bottom: 18, left: 22 };
  const chartW = width - pad.left - pad.right;
  const chartH = height - pad.top - pad.bottom;
  const maxVal = Math.max(1, ...data.map((d) => Math.max(d.Dials, d.Meetings)));
  const groupW = chartW / data.length;
  const barW = Math.max(2, Math.min(9, groupW / 3));

  let gridLines = '';
  [0, 0.5, 1].forEach((frac) => {
    const y = pad.top + chartH * (1 - frac);
    const val = Math.round(maxVal * frac);
    gridLines += `<line x1="${pad.left}" y1="${y}" x2="${width - pad.right}" y2="${y}" stroke="var(--paper-line)" stroke-width="1" stroke-dasharray="2,3" />`;
    gridLines += `<text x="${pad.left - 4}" y="${y + 3}" text-anchor="end" font-size="8" fill="var(--paper-ink)" font-family="var(--font-mono)">${val}</text>`;
  });

  let bars = '';
  data.forEach((d, i) => {
    const groupX = pad.left + i * groupW;
    const dialsH = (d.Dials / maxVal) * chartH;
    const meetingsH = (d.Meetings / maxVal) * chartH;
    const dialsX = groupX + groupW / 2 - barW - 1;
    const meetingsX = groupX + groupW / 2 + 1;
    bars += `<rect x="${dialsX.toFixed(1)}" y="${(pad.top + chartH - dialsH).toFixed(1)}" width="${barW.toFixed(1)}" height="${dialsH.toFixed(1)}" fill="var(--sig-neutral)"><title>${escapeHtml(d.date)}: ${d.Dials} dials</title></rect>`;
    bars += `<rect x="${meetingsX.toFixed(1)}" y="${(pad.top + chartH - meetingsH).toFixed(1)}" width="${barW.toFixed(1)}" height="${meetingsH.toFixed(1)}" fill="var(--sig-positive)"><title>${escapeHtml(d.date)}: ${d.Meetings} meetings</title></rect>`;
    if (i % 2 === 1 || data.length <= 7) {
      bars += `<text x="${(groupX + groupW / 2).toFixed(1)}" y="${height - 4}" text-anchor="middle" font-size="8" fill="var(--paper-ink)" font-family="var(--font-mono)">${escapeHtml(d.date)}</text>`;
    }
  });

  return `<svg viewBox="0 0 ${width} ${height}" style="width:100%;height:${height}px;display:block;">${gridLines}${bars}</svg>`;
}

/* =========================================================================
   PERSISTED STATE
   ========================================================================= */

const state = {
  entries: [], caller: '', campaign: '', sheetUrl: '',
  view: 'log', dashRange: 'today', historyRange: 'all',
  settingsOpen: false, lastLogged: null,
  confirmDeleteId: null, confirmClear: false, syncing: false,
  historyVisibleCount: 50,
};
let headerFlap = { dials: null, pickups: null, meetings: null };
let keyFlap = {};

async function loadState() {
  try {
    const res = await window.storage.get(ENTRIES_KEY, false);
    if (res && res.value) {
      state.entries = JSON.parse(res.value);
      if (state.entries.length > 0) state.lastLogged = state.entries[0];
    }
  } catch (e) { /* nothing stored yet */ }
  try {
    const res2 = await window.storage.get(SETTINGS_KEY, false);
    if (res2 && res2.value) {
      const s = JSON.parse(res2.value);
      state.caller = s.caller || '';
      state.campaign = s.campaign || '';
      state.sheetUrl = s.sheetUrl || '';
    }
  } catch (e) { /* nothing stored yet */ }
}

async function persistEntries(next) {
  state.entries = next;
  try { await window.storage.set(ENTRIES_KEY, JSON.stringify(next), false); }
  catch (e) { console.error('Failed to save call log', e); }
}
async function persistSettings() {
  try { await window.storage.set(SETTINGS_KEY, JSON.stringify({ caller: state.caller, campaign: state.campaign, sheetUrl: state.sheetUrl }), false); }
  catch (e) { console.error('Failed to save settings', e); }
}
function markSynced(id) {
  const next = state.entries.map((e) => (e.id === id ? { ...e, sheetSynced: true } : e));
  persistEntries(next);
}

/* =========================================================================
   ACTIONS
   ========================================================================= */

function logCall(outcomeId) {
  const entry = {
    id: `${Date.now()}_${Math.random().toString(36).slice(2, 8)}`,
    timestamp: new Date().toISOString(), outcome: outcomeId,
    campaign: state.campaign.trim(), caller: state.caller.trim(), sheetSynced: false,
  };
  persistEntries([entry, ...state.entries]);
  state.lastLogged = entry;
  updateStatusLine();

  const today = computeCounts(filterByRange(state.entries, 'today'));
  if (headerFlap.dials) headerFlap.dials.setValue(today.dials);
  if (headerFlap.pickups) headerFlap.pickups.setValue(today.pickups);
  if (headerFlap.meetings) headerFlap.meetings.setValue(today.meetings);
  if (keyFlap[outcomeId]) {
    const todayOutcomeCounts = {
      no_pickup: today.noPickup, pickup_no: today.pickupNo, pickup_follow_up: today.followUp,
      pickup_email: today.emailSent, pickup_meeting: today.meetings,
    };
    keyFlap[outcomeId].setValue(todayOutcomeCounts[outcomeId]);
  }

  if (state.sheetUrl) {
    syncEntryToSheet(state.sheetUrl, entry).then((ok) => { if (ok) markSynced(entry.id); });
  }
}

function undoLast() {
  if (state.entries.length === 0) return;
  const next = state.entries.slice(1);
  persistEntries(next);
  state.lastLogged = next[0] || null;
  renderShell();
  renderPanel();
}

function deleteEntry(id) {
  persistEntries(state.entries.filter((e) => e.id !== id));
  state.confirmDeleteId = null;
  closeModal();
  renderShell();
  renderPanel();
}

function clearAll() {
  persistEntries([]);
  state.lastLogged = null;
  state.confirmClear = false;
  closeModal();
  renderShell();
  renderPanel();
}

async function resyncUnsent() {
  if (!state.sheetUrl || state.syncing) return;
  state.syncing = true;
  renderPanel();
  const unsent = state.entries.filter((e) => !e.sheetSynced);
  for (const e of unsent) {
    const ok = await syncEntryToSheet(state.sheetUrl, e);
    if (ok) markSynced(e.id);
  }
  state.syncing = false;
  renderPanel();
}

/* =========================================================================
   RENDER: SHELL (nameplate, settings, mode selector)
   ========================================================================= */

function renderShell() {
  const today = computeCounts(filterByRange(state.entries, 'today'));

  const nameplateEl = document.getElementById('nameplate');
  nameplateEl.innerHTML = `
    <div class="nameplate-row">
      <div class="nameplate-title">COLD CALL LOG</div>
      <button class="key-focus settings-toggle" id="settings-toggle-btn">${state.settingsOpen ? '\u25B4' : '\u25BE'} SETUP</button>
    </div>
    <div class="nameplate-stats">
      <span class="nameplate-stat-block"><span id="header-flap-dials"></span><span class="nameplate-stat-label">DIALS</span></span>
      <span class="nameplate-stat-block"><span id="header-flap-pickups"></span><span class="nameplate-stat-label">PICKUPS</span></span>
      <span class="nameplate-stat-block"><span id="header-flap-meetings"></span><span class="nameplate-stat-label">MEETINGS</span></span>
    </div>`;
  document.getElementById('settings-toggle-btn').addEventListener('click', () => {
    state.settingsOpen = !state.settingsOpen;
    renderShell();
  });
  headerFlap.dials = createFlapCounter(document.getElementById('header-flap-dials'), today.dials, 2, 'sm');
  headerFlap.pickups = createFlapCounter(document.getElementById('header-flap-pickups'), today.pickups, 2, 'sm');
  headerFlap.meetings = createFlapCounter(document.getElementById('header-flap-meetings'), today.meetings, 2, 'sm');

  const settingsEl = document.getElementById('settings-panel');
  if (state.settingsOpen) {
    settingsEl.hidden = false;
    const recentCampaigns = [...new Set(state.entries.map((e) => e.campaign).filter(Boolean))].slice(0, 6);
    settingsEl.innerHTML = `
      <div class="settings-grid">
        <label class="settings-field">
          <span class="settings-label">CALLER</span>
          <input class="key-focus settings-input" id="input-caller" value="${escapeHtml(state.caller)}" placeholder="Leo">
        </label>
        <label class="settings-field">
          <span class="settings-label">CAMPAIGN / CLIENT</span>
          <input class="key-focus settings-input" id="input-campaign" value="${escapeHtml(state.campaign)}" placeholder="Contractor 2.0" list="campaign-suggestions">
          <datalist id="campaign-suggestions">${recentCampaigns.map((c) => `<option value="${escapeHtml(c)}"></option>`).join('')}</datalist>
        </label>
      </div>
      ${recentCampaigns.length ? `<div class="chip-row">${recentCampaigns.map((c) => `<button class="key-focus chip" data-campaign="${escapeHtml(c)}">${escapeHtml(c)}</button>`).join('')}</div>` : ''}
      <label class="settings-field" style="margin-top:10px;">
        <span class="settings-label">GOOGLE SHEET SYNC URL</span>
        <input class="key-focus settings-input" id="input-sheet-url" value="${escapeHtml(state.sheetUrl)}" placeholder="https://script.google.com/macros/s/.../exec">
      </label>
      <div class="sheet-status">
        <span class="sheet-status-dot" style="background:${state.sheetUrl ? 'var(--sig-positive)' : 'var(--ink-faint)'}"></span>
        ${state.sheetUrl ? 'SHEET SYNC ON, EACH LOGGED CALL POSTS A ROW' : 'SHEET SYNC OFF, PASTE YOUR APPS SCRIPT URL ABOVE'}
      </div>`;
    document.getElementById('input-caller').addEventListener('input', (e) => { state.caller = e.target.value; persistSettings(); });
    document.getElementById('input-campaign').addEventListener('input', (e) => { state.campaign = e.target.value; persistSettings(); });
    document.getElementById('input-sheet-url').addEventListener('input', (e) => {
      state.sheetUrl = e.target.value.trim();
      persistSettings();
      document.querySelector('.sheet-status').innerHTML = `<span class="sheet-status-dot" style="background:${state.sheetUrl ? 'var(--sig-positive)' : 'var(--ink-faint)'}"></span>${state.sheetUrl ? 'SHEET SYNC ON, EACH LOGGED CALL POSTS A ROW' : 'SHEET SYNC OFF, PASTE YOUR APPS SCRIPT URL ABOVE'}`;
    });
    settingsEl.querySelectorAll('[data-campaign]').forEach((btn) => {
      btn.addEventListener('click', () => {
        state.campaign = btn.dataset.campaign;
        document.getElementById('input-campaign').value = state.campaign;
        persistSettings();
      });
    });
  } else {
    settingsEl.hidden = true;
    settingsEl.innerHTML = '';
  }

  const modeEl = document.getElementById('mode-selector');
  modeEl.innerHTML = ['log', 'dashboard', 'history'].map((v) =>
    `<button class="key-focus mode-btn${state.view === v ? ' mode-btn-active' : ''}" data-view="${v}">${v === 'log' ? 'LOG CALL' : v.toUpperCase()}</button>`
  ).join('');
  modeEl.querySelectorAll('[data-view]').forEach((btn) => {
    btn.addEventListener('click', () => {
      state.view = btn.dataset.view;
      renderShell();
      renderPanel();
    });
  });
}

function updateStatusLine() {
  const el = document.getElementById('status-line');
  if (!el) return;
  el.innerHTML = renderStatusLineInner();
  const undoBtn = el.querySelector('[data-action="undo"]');
  if (undoBtn) undoBtn.addEventListener('click', () => undoLast());
}

function renderStatusLineInner() {
  const hasEntries = state.entries.length > 0;
  const body = state.lastLogged
    ? `<span class="status-line-label">LAST</span>
       <span class="status-line-dot" style="background:${OUTCOME_MAP[state.lastLogged.outcome].color}"></span>
       <span class="status-line-text">${escapeHtml(OUTCOME_MAP[state.lastLogged.outcome].short.toUpperCase())}</span>
       <span class="status-line-time">${formatTimeLabel(state.lastLogged.timestamp)}</span>`
    : `<span class="status-line-text">NO CALLS LOGGED YET, TAP A KEY TO START</span>`;
  return body + (hasEntries ? `<button class="key-focus undo-btn" data-action="undo">UNDO</button>` : '');
}

/* =========================================================================
   RENDER: PANEL (view router)
   ========================================================================= */

function renderPanel() {
  const panelEl = document.getElementById('panel');
  keyFlap = {};
  if (state.view === 'log') { panelEl.innerHTML = renderLogViewHtml(); mountLogView(); }
  else if (state.view === 'dashboard') { panelEl.innerHTML = renderDashboardHtml(); mountDashboardView(); }
  else { panelEl.innerHTML = renderHistoryHtml(); mountHistoryView(); }
}

/* ---- LOG VIEW ---- */

function renderLogViewHtml() {
  const keys = OUTCOMES.map((o) => `
    <button class="key-focus key-btn" data-outcome="${o.id}" style="--key-color:${o.color}">
      <span class="key-stripe" style="background:${o.color}"></span>
      <span class="key-code" style="color:${o.color}">${o.code}</span>
      <span class="key-label">${escapeHtml(o.label)}</span>
      <span class="key-readout" id="key-flap-${o.id}"></span>
    </button>`).join('');
  return `
    <div class="key-grid">${keys}</div>
    <div class="status-line" id="status-line">${renderStatusLineInner()}</div>`;
}

function mountLogView() {
  const today = computeCounts(filterByRange(state.entries, 'today'));
  const todayOutcomeCounts = {
    no_pickup: today.noPickup, pickup_no: today.pickupNo, pickup_follow_up: today.followUp,
    pickup_email: today.emailSent, pickup_meeting: today.meetings,
  };
  OUTCOMES.forEach((o) => {
    keyFlap[o.id] = createFlapCounter(document.getElementById(`key-flap-${o.id}`), todayOutcomeCounts[o.id], 3, 'sm');
  });
  document.querySelectorAll('[data-outcome]').forEach((btn) => {
    btn.addEventListener('click', () => logCall(btn.dataset.outcome));
  });
  const undoBtn = document.querySelector('[data-action="undo"]');
  if (undoBtn) undoBtn.addEventListener('click', () => undoLast());
}

/* ---- DASHBOARD VIEW ---- */

function renderDashboardHtml() {
  const stats = computeCounts(filterByRange(state.entries, state.dashRange === 'all' ? 'all' : state.dashRange));
  const weekStats = computeCounts(filterByRange(state.entries, 'week'));
  const lastWeekStats = computeCounts(filterByRange(state.entries, 'lastWeek'));
  const chartData = computeDailySeries(state.entries, 14);

  const pickupDelta = Math.round(weekStats.pickupRate * 100) - Math.round(lastWeekStats.pickupRate * 100);
  const meetingDelta = Math.round(weekStats.meetingRate * 100) - Math.round(lastWeekStats.meetingRate * 100);
  const deltaChip = (delta) => {
    const isUp = delta > 0, isDown = delta < 0;
    const arrow = isUp ? '\u25B2' : isDown ? '\u25BC' : '\u2013';
    const color = isUp ? 'var(--sig-positive)' : isDown ? 'var(--sig-negative)' : 'var(--ink-soft)';
    return `<span class="compare-delta" style="color:${color}">${arrow} ${isUp ? '+' : ''}${delta}pt</span>`;
  };

  return `
    <div class="range-switch" id="dash-range-switch">
      ${['today', 'week', 'month', 'all'].map((r) => `<button class="key-focus range-btn${state.dashRange === r ? ' range-btn-active' : ''}" data-range="${r}">${RANGE_LABEL[r]}</button>`).join('')}
    </div>
    <div class="readout-grid">
      <div class="readout-card"><div class="readout-label">DIALS</div><div class="readout-static">${stats.dials}</div></div>
      <div class="readout-card"><div class="readout-label">MEETINGS BOOKED</div><div class="readout-static">${stats.meetings}</div></div>
      <div class="readout-card"><div class="readout-label">PICKUP RATE</div><div class="readout-static">${pct(stats.pickupRate)}<span class="readout-pct">%</span></div><div class="readout-sub">${stats.pickups} OF ${stats.dials}</div></div>
      <div class="readout-card"><div class="readout-label">MEETING RATE</div><div class="readout-static">${pct(stats.meetingRate)}<span class="readout-pct">%</span></div><div class="readout-sub">OF ALL DIALS</div></div>
    </div>
    <div class="panel-box">
      <div class="panel-box-title">THIS WEEK VS LAST WEEK</div>
      <div class="compare-items">
        <div class="compare-item"><span class="compare-label">PICKUP RATE</span><span class="compare-value">${pct(weekStats.pickupRate)}%</span>${deltaChip(pickupDelta)}</div>
        <div class="compare-item"><span class="compare-label">MEETING RATE</span><span class="compare-value">${pct(weekStats.meetingRate)}%</span>${deltaChip(meetingDelta)}</div>
      </div>
    </div>
    <div class="panel-box">
      <div class="panel-box-title">LAST 14 DAYS</div>
      <div class="chart-frame">
        ${renderBarChartSvg(chartData, 560, 170)}
        <div class="chart-legend"><span><span class="legend-swatch" style="background:var(--sig-neutral)"></span>DIALS</span><span><span class="legend-swatch" style="background:var(--sig-positive)"></span>MEETINGS</span></div>
      </div>
    </div>
    <div class="panel-box">
      <div class="panel-box-title">BREAKDOWN, ${RANGE_LABEL[state.dashRange]}</div>
      ${breakdownRowHtml('NO PICKUP', stats.noPickup, stats.dials, 'var(--sig-neutral)')}
      ${breakdownRowHtml('NOT INTERESTED', stats.pickupNo, stats.dials, 'var(--sig-negative)')}
      ${breakdownRowHtml('FOLLOW UP', stats.followUp, stats.dials, 'var(--sig-pending)')}
      ${breakdownRowHtml('EMAIL SENT', stats.emailSent, stats.dials, 'var(--sig-info)')}
      ${breakdownRowHtml('MEETING BOOKED', stats.meetings, stats.dials, 'var(--sig-positive)')}
    </div>`;
}

function breakdownRowHtml(label, value, total, color) {
  const width = total ? Math.max((value / total) * 100, value > 0 ? 2 : 0) : 0;
  return `
    <div class="breakdown-row">
      <div class="breakdown-label-row">
        <span class="breakdown-swatch" style="background:${color}"></span>
        <span class="breakdown-label">${label}</span>
        <span class="breakdown-value">${value}</span>
      </div>
      <div class="breakdown-track"><div class="breakdown-fill" style="width:${width}%;background:${color}"></div></div>
    </div>`;
}

function mountDashboardView() {
  document.querySelectorAll('#dash-range-switch [data-range]').forEach((btn) => {
    btn.addEventListener('click', () => { state.dashRange = btn.dataset.range; renderPanel(); });
  });
}

/* ---- HISTORY VIEW ---- */

function renderHistoryHtml() {
  const filtered = state.historyRange === 'all' ? state.entries : filterByRange(state.entries, state.historyRange);
  const sorted = [...filtered].sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));
  const visible = sorted.slice(0, state.historyVisibleCount);
  const unsyncedCount = state.entries.filter((e) => !e.sheetSynced).length;

  const rangeSwitch = `<div class="range-switch" id="hist-range-switch">${['today', 'week', 'month', 'all'].map((r) => `<button class="key-focus range-btn${state.historyRange === r ? ' range-btn-active' : ''}" data-range="${r}">${RANGE_LABEL[r]}</button>`).join('')}</div>`;

  const toolbarBtns = `
    <div class="toolbar-btns">
      ${state.sheetUrl ? `<button class="key-focus tool-btn" id="resync-btn" ${state.syncing || unsyncedCount === 0 ? 'disabled' : ''}>${state.syncing ? 'SYNCING\u2026' : unsyncedCount > 0 ? `SYNC ${unsyncedCount} TO SHEET` : 'SHEET UP TO DATE'}</button>` : ''}
      <button class="key-focus tool-btn tool-btn-primary" id="export-btn" ${state.entries.length === 0 ? 'disabled' : ''}>EXPORT EXCEL</button>
    </div>`;

  const table = sorted.length === 0 ? `<div class="empty-state">NO CALLS IN THIS RANGE</div>` : `
    <div class="ledger">
      <table class="log-table">
        <thead><tr><th>DATE</th><th>TIME</th><th>OUTCOME</th><th>TAG</th><th class="th-action"></th></tr></thead>
        <tbody>
          ${visible.map((e, i) => `
            <tr class="tr-row" style="background:${i % 2 === 1 ? 'var(--paper-alt)' : 'transparent'}">
              <td>${formatDateLabel(e.timestamp)}</td>
              <td style="font-family:var(--font-mono)">${formatTimeLabel(e.timestamp)}</td>
              <td><span class="outcome-dot" style="background:${OUTCOME_MAP[e.outcome].color}"></span>${escapeHtml(OUTCOME_MAP[e.outcome].short.toUpperCase())}</td>
              <td>${escapeHtml(e.campaign) || '-'}</td>
              <td class="td-action"><button class="key-focus delete-btn" data-delete-id="${e.id}" aria-label="Delete entry">\u00D7</button></td>
            </tr>`).join('')}
        </tbody>
      </table>
      ${sorted.length > state.historyVisibleCount ? `<button class="key-focus load-more-btn" id="load-more-btn">LOAD MORE (${sorted.length - state.historyVisibleCount} REMAINING)</button>` : ''}
    </div>`;

  const clearBtn = state.entries.length > 0 ? `<button class="key-focus clear-all-btn" id="clear-all-btn">CLEAR ALL DATA</button>` : '';

  return `<div class="history-toolbar">${rangeSwitch}${toolbarBtns}</div>${table}${clearBtn}`;
}

function mountHistoryView() {
  document.querySelectorAll('#hist-range-switch [data-range]').forEach((btn) => {
    btn.addEventListener('click', () => { state.historyRange = btn.dataset.range; state.historyVisibleCount = 50; renderPanel(); });
  });
  const exportBtn = document.getElementById('export-btn');
  if (exportBtn) exportBtn.addEventListener('click', () => exportToExcel(state.entries));
  const resyncBtn = document.getElementById('resync-btn');
  if (resyncBtn) resyncBtn.addEventListener('click', () => resyncUnsent());
  const loadMoreBtn = document.getElementById('load-more-btn');
  if (loadMoreBtn) loadMoreBtn.addEventListener('click', () => { state.historyVisibleCount += 50; renderPanel(); });
  document.querySelectorAll('[data-delete-id]').forEach((btn) => {
    btn.addEventListener('click', () => { state.confirmDeleteId = btn.dataset.deleteId; openModal(); });
  });
  const clearAllBtn = document.getElementById('clear-all-btn');
  if (clearAllBtn) clearAllBtn.addEventListener('click', () => { state.confirmClear = true; openModal(); });
}

/* =========================================================================
   MODAL
   ========================================================================= */

function openModal() {
  const root = document.getElementById('modal-root');
  if (state.confirmDeleteId) {
    root.innerHTML = modalHtml('DELETE ENTRY', 'This removes it from the log for good.');
  } else if (state.confirmClear) {
    root.innerHTML = modalHtml('CLEAR ALL DATA', `This permanently deletes all ${state.entries.length} logged calls. Export first if you want a copy.`);
  }
  const overlay = root.querySelector('.modal-overlay');
  if (!overlay) return;
  overlay.addEventListener('click', (e) => { if (e.target === overlay) { closeModal(); } });
  root.querySelector('[data-action="modal-cancel"]').addEventListener('click', closeModal);
  root.querySelector('[data-action="modal-confirm"]').addEventListener('click', () => {
    if (state.confirmDeleteId) deleteEntry(state.confirmDeleteId);
    else if (state.confirmClear) clearAll();
  });
}
function closeModal() {
  state.confirmDeleteId = null;
  state.confirmClear = false;
  document.getElementById('modal-root').innerHTML = '';
}
function modalHtml(title, body) {
  return `
    <div class="modal-overlay">
      <div class="modal-card">
        <div class="modal-title">${title}</div>
        <div class="modal-body">${body}</div>
        <div class="modal-actions">
          <button class="key-focus modal-cancel" data-action="modal-cancel">CANCEL</button>
          <button class="key-focus modal-confirm" data-action="modal-confirm">CONFIRM</button>
        </div>
      </div>
    </div>`;
}

/* =========================================================================
   INIT
   ========================================================================= */

async function init() {
  const app = document.getElementById('app');
  app.innerHTML = `<div class="loading-wrap"><span class="flap-row flap-lg" id="boot-flap"></span><div class="loading-text">WARMING UP</div></div>`;
  createFlapCounter(document.getElementById('boot-flap'), 0, 3, 'lg');

  await loadState();

  app.innerHTML = `
    <div class="chassis">
      <div class="nameplate" id="nameplate"></div>
      <div class="settings-panel" id="settings-panel" hidden></div>
      <div class="mode-selector" id="mode-selector"></div>
      <div class="panel" id="panel"></div>
    </div>`;
  renderShell();
  renderPanel();
}

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', init);
} else {
  init();
}
</script>
